services:
  mariadb:
    image: mariadb:11
    container_name: student-ms-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: student_ms
      MARIADB_USER: student
      MARIADB_PASSWORD: student123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql
    networks:
      - student-ms
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: student-ms-php
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./:/var/www/html
      - php-runtime:/var/www/html/runtime
    networks:
      - student-ms

  nginx:
    image: nginx:alpine
    container_name: student-ms-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - student-ms

volumes:
  mariadb-data:
  php-runtime:

networks:
  student-ms:
    driver: bridge
