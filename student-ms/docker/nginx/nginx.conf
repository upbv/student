server {
    listen       80;
    server_name  localhost;

    root   /var/www/html/public;
    index  index.php index.html;

    charset utf-8;
    client_max_body_size 16m;

    access_log /var/log/nginx/student-ms.access.log;
    error_log  /var/log/nginx/student-ms.error.log;

    # ThinkPHP6 重写规则：静态文件直接返回，其余交给入口文件处理
    location / {
        try_files $uri $uri/ @thinkphp;
    }

    location @thinkphp {
        rewrite ^ /index.php$uri last;
    }

    # 静态资源
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
    }

    location ~ \.php(/.*)?$ {
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        include       fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # 禁止访问敏感目录
    location ~ /\.(?!well-known) {
        deny all;
    }
}
