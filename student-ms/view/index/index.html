<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{$title}</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin" id="appLayout">

    <!-- 侧边导航 -->
    <aside class="layui-side" id="sideBar">
        <div class="side-brand">
            <a href="javascript:;" class="brand-link" data-home="1">
                <span class="brand-mark">学</span>
                <span class="brand-text">
                    <strong>学生管理系统</strong>
                    <em>Student Management</em>
                </span>
            </a>
        </div>
        <div class="side-scroll">
            <nav class="side-nav" id="sideMenu"></nav>
        </div>
        <div class="side-foot">ThinkPHP 6 · Layui</div>
    </aside>

    <!-- 顶栏 -->
    <header class="app-header">
        <div class="header-left">
            <a href="javascript:;" class="head-icon" id="foldSide" title="折叠菜单">
                <i class="layui-icon layui-icon-shrink-right"></i>
            </a>
            <span class="head-sep"></span>
            <span class="head-title" id="headTitle">控制台</span>
        </div>
        <div class="header-right">
            <a href="javascript:;" class="head-icon" id="refreshTab" title="刷新当前页">
                <i class="layui-icon layui-icon-refresh-3"></i>
            </a>
            <a href="javascript:;" class="head-icon" id="fullScreen" title="全屏">
                <i class="layui-icon layui-icon-screen-full"></i>
            </a>
            <span class="head-sep"></span>
            <div class="user-box" id="userBox">
                <span class="user-avatar">{$nickname_initial}</span>
                <span class="user-name">{$nickname}</span>
                <i class="layui-icon layui-icon-down caret"></i>
                <div class="user-menu" id="userMenu">
                    <a href="javascript:;" data-tab="/profile">个人资料</a>
                    <a href="javascript:;" id="changePwd">修改密码</a>
                    <a href="/logout">退出登录</a>
                </div>
            </div>
        </div>
    </header>

    <!-- 内容区 -->
    <div class="layui-body">
        <div class="tab-bar">
            <div class="tab-list" id="tabTitle">
                <div class="tab-item active" lay-id="/dashboard" data-frame="mainFrame">
                    <i class="layui-icon layui-icon-home"></i>
                    <span>控制台</span>
                </div>
            </div>
        </div>
        <div class="tab-content" id="tabContent">
            <iframe id="mainFrame" name="mainFrame" src="/dashboard" data-layid="/dashboard" frameborder="0" scrolling="auto"></iframe>
        </div>
    </div>

    <footer class="app-footer">
        <span>计算机信息学院 · 信息安全 2408 班</span>
        <span class="dot">·</span>
        <span>毕业设计作品</span>
    </footer>
</div>

<!-- 修改密码弹层 -->
<script type="text/html" id="pwdLayer">
    <form class="layui-form layer-form" id="pwdForm" lay-filter="pwdForm">
        <div class="layui-form-item">
            <label class="layui-form-label">原密码</label>
            <div class="layui-input-block">
                <input type="password" name="old_password" class="layui-input" lay-verify="required" lay-required placeholder="请输入原密码">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">新密码</label>
            <div class="layui-input-block">
                <input type="password" name="new_password" class="layui-input" lay-verify="required|pass" lay-required placeholder="不少于 6 位">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">确认密码</label>
            <div class="layui-input-block">
                <input type="password" name="new_password_confirm" class="layui-input" lay-verify="required" lay-required placeholder="再次输入新密码">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="submitPwd">确认修改</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelPwd">取消</button>
            </div>
        </div>
    </form>
</script>

<script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script src="/static/layui/admin.js"></script>
</body>
</html>
