<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{$title}</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">

    <!-- 侧边菜单 -->
    <div class="layui-side layui-bg-black">
        <div class="layui-side-hd">
            <a href="/dashboard" class="layui-logo">
                <i class="layui-icon layui-icon-read"></i>
                <span>学生管理系统</span>
            </a>
        </div>
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree" id="sideMenu" lay-filter="sideMenu"></ul>
        </div>
    </div>

    <!-- 头部 -->
    <div class="layui-header">
        <div class="layui-hd">
            <ul class="layui-nav layui-layout-left">
                <li class="layui-nav-item layui-layout-item" id="foldSide">
                    <a href="javascript:;" title="折叠菜单">
                        <i class="layui-icon layui-icon-shrink-right"></i>
                    </a>
                </li>
                <li class="layui-nav-item layui-layout-item">
                    <a href="javascript:;" id="refreshTab" title="刷新当前页">
                        <i class="layui-icon layui-icon-refresh-3"></i>
                    </a>
                </li>
                <li class="layui-nav-item layui-layout-item layui-layout-item-logo">
                    <span class="sys-title">学生管理系统 v1.0</span>
                </li>
            </ul>
            <ul class="layui-nav layui-layout-right layui-this">
                <li class="layui-nav-item layui-layout-item">
                    <a href="javascript:;" id="noticeBtn" title="系统概览">
                        <i class="layui-icon layui-icon-notice"></i>
                    </a>
                </li>
                <li class="layui-nav-item layui-layout-item">
                    <a href="javascript:;" id="fullScreen">
                        <i class="layui-icon layui-icon-screen-full"></i>
                    </a>
                </li>
                <li class="layui-nav-item layui-layout-item">
                    <a href="javascript:;" id="userInfo">
                        <span class="user-avatar">{$nickname_initial}</span>
                        <span class="layui-nav-usertext">{$nickname}</span>
                        <i class="layui-icon layui-icon-down"></i>
                    </a>
                    <dl class="layui-nav-child layui-nav-child-right">
                        <dd><a href="javascript:;" data-tab="/profile">个人资料</a></dd>
                        <dd><a href="javascript:;" id="changePwd">修改密码</a></dd>
                        <dd><a href="/login/logout">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="layui-body">
        <div class="layui-tab layui-tab-brief" id="layuiTab" lay-filter="layuiTab">
            <ul class="layui-tab-title" id="tabTitle">
                <li class="layui-this" lay-id="/dashboard" id="homeTab">
                    <i class="layui-icon layui-icon-home"></i> 控制台
                </li>
            </ul>
            <div class="layui-tab-content" id="tabContent">
                <iframe id="mainFrame" name="mainFrame" src="/dashboard" frameborder="0" scrolling="auto"></iframe>
            </div>
        </div>
    </div>

    <div class="layui-footer">
        学生管理系统 &copy; 2026 ThinkPHP6 + Layui &nbsp;|&nbsp; 毕业设计作品
    </div>
</div>

<!-- 修改密码弹层 -->
<script type="text/html" id="pwdLayer">


    <form class="layui-form" id="pwdForm" lay-filter="pwdForm">
        <div class="layui-form-item">
            <label class="layui-form-label">原密码</label>
            <div class="layui-input-block">
                <input type="password" name="old_password" class="layui-input" lay-verify="required" lay-required placeholder="请输入原密码">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">新密码</label>
            <div class="layui-input-block">
                <input type="password" name="new_password" class="layui-input" lay-verify="required|pass" lay-required placeholder="不少于 6 位">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">确认密码</label>
            <div class="layui-input-block">
                <input type="password" name="new_password_confirm" class="layui-input" lay-verify="required" lay-required placeholder="再次输入新密码">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="submitPwd">确认修改</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelPwd">取消</button>
            </div>
        </div>
    </form>
</script><script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script src="/static/layui/admin.js"></script>
</body>
</html>
