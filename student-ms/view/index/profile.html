<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>个人资料</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">个人资料</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><em>个人资料</em></span>
    </div>

    <div class="profile-grid">
        <div class="profile-side">
            <div class="user-avatar" style="width:76px;height:76px;line-height:76px;font-size:28px;">{$admin.nickname_initial}</div>
            <div class="name">{$admin.nickname}</div>
            <div class="role">{$admin.role_names}</div>
            <table class="layui-table lay-size="sm" style="margin-top:18px;">
                <tbody>
                <tr><th style="width:76px;">账号</th><td>{$admin.username}</td></tr>
                <tr><th>状态</th><td><span class="status-dot {$admin.status_dot}"></span>{$admin.status_text}</td></tr>
                <tr><th>最后登录</th><td>{$admin.last_login_text}</td></tr>
                </tbody>
            </table>
        </div>

        <div class="profile-main">
            <div class="panel-title"><span>基本资料</span></div>
            <form class="layui-form" lay-filter="profileForm" id="profileForm">
                <div class="layui-row">
                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" style="width:80px;">登录账号</label>
                            <div class="layui-input-block" style="margin-left:110px;">
                                <input type="text" class="layui-input layui-disabled" value="{$admin.username}" disabled>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" style="width:80px;">姓名</label>
                            <div class="layui-input-block" style="margin-left:110px;">
                                <input type="text" name="nickname" class="layui-input" lay-verify="required" lay-required value="{$admin.nickname}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" style="width:80px;">联系电话</label>
                            <div class="layui-input-block" style="margin-left:110px;">
                                <input type="text" name="phone" class="layui-input" value="{$admin.phone}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md6">
                        <div class="layui-form-item">
                            <label class="layui-form-label" style="width:80px;">电子邮箱</label>
                            <div class="layui-input-block" style="margin-left:110px;">
                                <input type="text" name="email" class="layui-input" value="{$admin.email}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block" style="margin-left:110px;">
                        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-submit lay-filter="submitProfile">保存修改</button>
                        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetProfile">还原</button>
                    </div>
                </div>
            </form>

            <div class="panel-title" style="margin-top:6px;"><span>登录信息</span></div>
            <table class="layui-table desc-table" lay-size="sm">
                <tbody>
                <tr><th>最近登录</th><td>{$admin.last_login_text}</td><th>登录 IP</th><td>{$admin.last_login_ip}</td></tr>
                <tr><th>所属角色</th><td colspan="3">{$admin.role_names}</td></tr>
                <tr><th>账号创建</th><td colspan="3">{$admin.create_time_text}</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer'], function () {
    var form = layui.form, layer = layui.layer, $ = layui.$;

    form.on('submit(submitProfile)', function (data) {
        var index = layer.load(2);
        $.post('/profile/save', data.field, function (res) {
            layer.close(index);
            if (res.code === 1) {
                layer.msg(res.msg, {icon: 1});
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        }, 'json');
        return false;
    });

    $('#resetProfile').on('click', function () {
        $('#profileForm')[0].reset();
        form.render(null, 'profileForm');
    });
});
</script>
</body>
</html>
