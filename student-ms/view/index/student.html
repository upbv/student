<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>我的主页</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">我的主页</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><em>学生服务</em></span>
    </div>

    <!-- 个人信息 -->
    <div class="table-box" style="margin-bottom:10px;padding:16px 18px;">
        <div class="my-profile">
            <span class="user-avatar" id="myAvatar">-</span>
            <div class="my-profile-text">
                <div class="name"><span id="myName">-</span><small id="myStatus"></small></div>
                <div class="meta">学号 <b id="myNo">-</b>　·　班级 <b id="myClass">-</b>　·　联系电话 <b id="myPhone">-</b></div>
            </div>
            <a class="layui-btn layui-btn-sm layui-btn-normal" href="javascript:;" data-open="/myleave">申请请假</a>
        </div>
    </div>

    <div class="panel-grid">
        <div class="panel-card">
            <div class="num" id="statCourse">-</div>
            <div class="label">在修课程</div>
        </div>
        <div class="panel-card">
            <div class="num" id="statCredit">-</div>
            <div class="label">已修学分</div>
        </div>
        <div class="panel-card">
            <div class="num" id="statAvg">-</div>
            <div class="label">平均成绩</div>
        </div>
        <div class="panel-card">
            <div class="num" id="statLeave">-</div>
            <div class="label">待审批请假</div>
        </div>
        <div class="panel-card">
            <div class="num" id="statAid">-</div>
            <div class="label">资助记录</div>
        </div>
    </div>

    <div class="layui-row layui-col-space8">
        <div class="layui-col-md7">
            <div class="table-box">
                <div class="panel-title">
                    <span>我的课程成绩</span>
                    <span class="more" data-open="/mygrade">全部成绩 &gt;</span>
                </div>
                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>课程名称</th>
                        <th style="width:70px;">学分</th>
                        <th style="width:100px;">任课教师</th>
                        <th style="width:110px;">学期</th>
                        <th style="width:70px;">成绩</th>
                    </tr>
                    </thead>
                    <tbody id="gradeBody"></tbody>
                </table>
            </div>
        </div>
        <div class="layui-col-md5">
            <div class="table-box" style="margin-bottom:8px;">
                <div class="panel-title">
                    <span>我的请假</span>
                    <span class="more" data-open="/myleave">办理请假 &gt;</span>
                </div>
                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>类型</th>
                        <th>起止日期</th>
                        <th style="width:70px;">天数</th>
                        <th style="width:80px;">状态</th>
                    </tr>
                    </thead>
                    <tbody id="leaveBody"></tbody>
                </table>
            </div>
            <div class="table-box">
                <div class="panel-title">
                    <span>我的资助</span>
                    <span class="more" data-open="/myaid">查看详情 &gt;</span>
                </div>
                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>类型</th>
                        <th>学期</th>
                        <th style="width:90px;">金额</th>
                        <th style="width:80px;">状态</th>
                    </tr>
                    </thead>
                    <tbody id="aidBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['layer'], function () {
    var layer = layui.layer, $ = layui.$;

    function statusDot(cls) {
        return '<span class="status-dot ' + cls + '"></span>';
    }

    var leaveCls = {0: 'status-warn', 1: 'status-on', 2: 'status-off'};
    var aidCls = {0: 'status-warn', 1: 'status-on', 2: 'status-off'};

    $('[data-open]').on('click', function () {
        var url = $(this).data('open');
        if (window.parent && window.parent !== window && window.parent.appOpenTab) {
            window.parent.appOpenTab(url, $(this).text().replace(/\s*>$/, '').trim());
        } else {
            window.location.href = url;
        }
    });

    $.get('/dashboard/student', function (res) {
        if (res.code !== 1) { layer.msg('数据加载失败', {icon: 2}); return; }
        var d = res.data, p = d.profile, s = d.stats;

        $('#myAvatar').text((p.name || '学').charAt(0));
        $('#myName').text(p.name || '-');
        $('#myStatus').text(p.status_text || '');
        $('#myNo').text(p.student_no || '-');
        $('#myClass').text(p.class_name || '-');
        $('#myPhone').text(p.phone || '-');

        $('#statCourse').text(s.courseCount);
        $('#statCredit').text(s.creditTotal);
        $('#statAvg').text(s.avgScore);
        $('#statLeave').text(s.leavePending);
        $('#statAid').text(s.aidCount);

        var gHtml = '';
        d.grades.forEach(function (g) {
            gHtml += '<tr>' +
                '<td>' + g.course_name + '</td>' +
                '<td>' + g.credit + '</td>' +
                '<td>' + (g.teacher_name || '-') + '</td>' +
                '<td>' + g.semester + '</td>' +
                '<td>' + (g.score === null ? '未录入' : g.score) + '</td>' +
                '</tr>';
        });
        $('#gradeBody').html(gHtml || '<tr><td colspan="5" class="empty-tip">暂无选课记录</td></tr>');

        var lHtml = '';
        d.leaves.forEach(function (l) {
            lHtml += '<tr>' +
                '<td>' + l.type_text + '</td>' +
                '<td>' + l.start_date + ' ~ ' + l.end_date + '</td>' +
                '<td>' + l.days + '</td>' +
                '<td>' + statusDot(leaveCls[l.status]) + l.status_text + '</td>' +
                '</tr>';
        });
        $('#leaveBody').html(lHtml || '<tr><td colspan="4" class="empty-tip">暂无请假记录</td></tr>');

        var aHtml = '';
        d.aids.forEach(function (a) {
            aHtml += '<tr>' +
                '<td>' + a.type_text + '</td>' +
                '<td>' + a.semester + '</td>' +
                '<td>' + a.amount + '</td>' +
                '<td>' + statusDot(aidCls[a.status]) + a.status_text + '</td>' +
                '</tr>';
        });
        $('#aidBody').html(aHtml || '<tr><td colspan="4" class="empty-tip">暂无资助记录</td></tr>');
    }, 'json');
});
</script>
</body>
</html>
