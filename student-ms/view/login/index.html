<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{$title}</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body class="login-body">
<div class="login-wrap">
    <div class="login-top">
        <span class="brand-name">学生管理系统</span>
        <span class="brand-sub">Student Management System</span>
    </div>

    <div class="login-main">
        <div class="login-card">
            <h1>用户登录</h1>
            <p class="hint">请输入账号和密码进入系统</p>

            <form class="layui-form" id="loginForm" lay-filter="loginForm">
                <div class="layui-form-item">
                    <div class="field">
                        <i class="layui-icon layui-icon-username"></i>
                        <input type="text" name="username" id="username" placeholder="登录账号"
                               autocomplete="off" class="layui-input" lay-verify="required" lay-required
                               maxlength="30">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="field">
                        <i class="layui-icon layui-icon-password"></i>
                        <input type="password" name="password" id="password" placeholder="登录密码"
                               autocomplete="off" class="layui-input" lay-verify="required" lay-required
                               maxlength="32">
                    </div>
                </div>
                <div class="layui-form-item" style="margin-bottom:8px;">
                    <button class="layui-btn" lay-submit lay-filter="doLogin">登 录</button>
                </div>
            </form>

            <div class="login-tip">
                管理员 <b>admin / admin123</b>　　辅导员 <b>counselor / counselor123</b><br>
                教　师 <b>teacher / teacher123</b>　　学　生 <b>2400012811 / student123</b>
            </div>
        </div>
    </div>

    <div class="login-bottom">
        计算机信息学院 · 信息安全 2408 班 毕业设计作品<br>
        ThinkPHP 6 + Layui
    </div>
</div>

<script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer'], function () {
    var form = layui.form,
        layer = layui.layer,
        $ = layui.$;

    form.on('submit(doLogin)', function (data) {
        var loading = layer.load(2, {shade: [0.08, '#fff']});
        $.post('/login/do', data.field, function (res) {
            layer.close(loading);
            if (res.code === 1) {
                layer.msg(res.msg, {icon: 1, time: 700}, function () {
                    window.location.href = res.url;
                });
            } else {
                layer.msg(res.msg, {icon: 2, time: 2000});
            }
        }, 'json').fail(function () {
            layer.close(loading);
            layer.msg('请求失败，请检查服务是否正常', {icon: 2, time: 2000});
        });
        return false;
    });

    $('#password').on('keyup', function (e) {
        if (e.keyCode === 13) {
            $('#loginForm').find('button').click();
        }
    });
});
</script>
</body>
</html>
