<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>课程管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">课程管理</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><span>教务管理</span><span class="sep">/</span><em>课程管理</em></span>
    </div>

    <div class="search-box">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-row">
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">关键字</label>
                        <div class="layui-input-inline" style="width:170px;">
                            <input type="text" name="keyword" placeholder="课程编号 / 名称" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">授课教师</label>
                        <div class="layui-input-inline" style="width:150px;">
                            <select name="teacher_id">
                                <option value="">全部教师</option>
                                {volist name="teachers" id="vo"}
                                <option value="{$vo.id}">{$vo.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">开课学期</label>
                        <div class="layui-input-inline" style="width:150px;">
                            <input type="text" name="semester" placeholder="如：2024-2025-1" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn">查询</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="table-box">
        <div class="tool-bar">
            <button class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i> 新增课程</button>
        </div>
        <table class="layui-table" lay-size="sm" style="margin-top:6px;">
            <thead>
            <tr>
                <th style="width:70px;">ID</th>
                <th style="width:110px;">课程编号</th>
                <th>课程名称</th>
                <th style="width:70px;">学分</th>
                <th style="width:70px;">学时</th>
                <th style="width:90px;">课程类型</th>
                <th style="width:100px;">授课教师</th>
                <th style="width:130px;">开课学期</th>
                <th style="width:80px;">选课人数</th>
                <th style="width:80px;">状态</th>
                <th style="width:150px;">操作</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="dataPage" class="page-foot"></div>
    </div>
</div>

<script type="text/html" id="editLayer">

    <form class="layui-form" id="editForm" lay-filter="editForm">
        <input type="hidden" name="id" id="fieldId">
        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">课程编号</label>
                    <div class="layui-input-block">
                        <input type="text" name="course_no" class="layui-input" lay-verify="required" lay-required placeholder="如：CS101">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">课程名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" class="layui-input" lay-verify="required" lay-required placeholder="如：数据结构">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">学分</label>
                    <div class="layui-input-block">
                        <input type="text" name="credit" class="layui-input" lay-verify="required|number" lay-required placeholder="如：3.0">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">学时</label>
                    <div class="layui-input-block">
                        <input type="number" name="hours" class="layui-input" value="32" min="0">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">课程类型</label>
                    <div class="layui-input-block">
                        <select name="course_type">
                            <option value="1">必修课</option>
                            <option value="2">选修课</option>
                            <option value="3">公共课</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">开课学期</label>
                    <div class="layui-input-block">
                        <input type="text" name="semester" class="layui-input" lay-verify="required" lay-required placeholder="如：2024-2025-1">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">授课教师</label>
                    <div class="layui-input-block">
                        <select name="teacher_id">
                            <option value="0">未指定</option>
                            {volist name="teachers" id="vo"}
                            <option value="{$vo.id}">{$vo.name}</option>
                            {/volist}
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">开课院系</label>
                    <div class="layui-input-block">
                        <select name="department_id">
                            <option value="0">未设置</option>
                            {volist name="departments" id="vo"}
                            <option value="{$vo.id}">{$vo.name}</option>
                            {/volist}
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">课程状态</label>
                    <div class="layui-input-block">
                        <select name="status">
                            <option value="1">开课</option>
                            <option value="0">停开</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md12">
                <div class="layui-form-item">
                    <label class="layui-form-label">课程简介</label>
                    <div class="layui-input-block">
                        <textarea name="remark" class="layui-textarea" style="height:70px;" placeholder="选填"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="submitEdit">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelEdit">取消</button>
            </div>
        </div>
    </form>
</script><script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer', 'laypage'], function () {
    var form = layui.form, layer = layui.layer, laypage = layui.laypage, $ = layui.$;
    var page = 1, limit = 15, rows = [];

    function render(list, count) {
        rows = list;
        var html = '';
        if (!list.length) {
            html = '<tr><td colspan="11" class="empty-tip"><i class="layui-icon layui-icon-face-surprised"></i><br>暂无课程数据</td></tr>';
        }
        list.forEach(function (r) {
            html += '<tr>' +
                '<td>' + r.id + '</td>' +
                '<td>' + r.course_no + '</td>' +
                '<td>' + r.name + '</td>' +
                '<td>' + r.credit + '</td>' +
                '<td>' + r.hours + '</td>' +
                '<td>' + r.course_type_text + '</td>' +
                '<td>' + r.teacher_name + '</td>' +
                '<td>' + r.semester + '</td>' +
                '<td>' + r.select_count + '</td>' +
                '<td><span class="status-dot ' + (r.status == 1 ? 'status-on' : 'status-off') + '"></span>' + (r.status == 1 ? '开课' : '停开') + '</td>' +
                '<td>' +
                '<a class="layui-btn layui-btn-xs layui-btn-warm" data-act="edit" data-id="' + r.id + '">编辑</a>' +
                '<a class="layui-btn layui-btn-xs layui-btn-danger" data-act="delete" data-id="' + r.id + '">删除</a>' +
                '</td></tr>';
        });
        $('#tableBody').html(html);

        laypage.render({
            elem: 'dataPage', count: count, limit: limit, curr: page,
            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
            jump: function (obj, first) {
                if (!first) { page = obj.curr; limit = obj.limit; loadData(); }
            }
        });
    }

    function loadData() {
        $.get('/course/list', $('#searchForm').serialize() + '&page=' + page + '&limit=' + limit, function (res) {
            if (res.code !== 0) { layer.msg('数据加载失败', {icon: 2}); return; }
            render(res.data, res.count);
        }, 'json');
    }

    form.on('submit(searchBtn)', function () { page = 1; loadData(); return false; });
    $('#resetBtn').on('click', function () {
        $('#searchForm')[0].reset(); form.render(null, 'searchForm'); page = 1; loadData();
    });

    $('#btnAdd').on('click', function () {
        layer.open({
            type: 1, title: '新增课程', content: $('#editLayer').html(), area: ['720px', '580px'],
            success: function () { form.render(null, 'editForm'); }
        });
    });

    $('#tableBody').on('click', 'a[data-act]', function () {
        var act = $(this).data('act'), id = $(this).data('id');
        var row = rows.filter(function (d) { return d.id == id; })[0];
        if (!row) { return; }

        if (act === 'edit') {
            layer.open({
                type: 1, title: '编辑课程', content: $('#editLayer').html(), area: ['720px', '580px'],
                success: function () {
                    form.render(null, 'editForm');
                    $('#fieldId').val(row.id);
                    $('#editForm [name=course_no]').val(row.course_no);
                    $('#editForm [name=name]').val(row.name);
                    $('#editForm [name=credit]').val(row.credit);
                    $('#editForm [name=hours]').val(row.hours);
                    $('#editForm [name=course_type]').val(row.course_type);
                    $('#editForm [name=semester]').val(row.semester);
                    $('#editForm [name=teacher_id]').val(row.teacher_id);
                    $('#editForm [name=department_id]').val(row.department_id);
                    $('#editForm [name=status]').val(row.status);
                    $('#editForm [name=remark]').val(row.remark);
                    form.render(null, 'editForm');
                }
            });
        } else if (act === 'delete') {
            layer.confirm('确定删除课程「' + row.name + '」吗？', function (index) {
                layer.close(index);
                $.post('/course/delete', {id: id}, function (res) {
                    layer.msg(res.code === 1 ? '删除成功' : res.msg, {icon: res.code === 1 ? 1 : 2});
                    if (res.code === 1) { loadData(); }
                }, 'json');
            });
        }
    });

    form.on('submit(submitEdit)', function (data) {
        var index = layer.load(2);
        $.post('/course/save', data.field, function (res) {
            layer.close(index);
            if (res.code === 1) {
                layer.msg(res.msg, {icon: 1});
                setTimeout(function () { layer.closeAll(); loadData(); }, 500);
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        }, 'json');
        return false;
    });

    $(document).on('click', '#cancelEdit', function () { layer.closeAll(); });
    loadData();
});
</script>
</body>
</html>
