<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>成绩管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">成绩管理</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><span>教务管理</span><span class="sep">/</span><em>成绩管理</em></span>
    </div>

    <div class="search-box">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-row">
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">关键字</label>
                        <div class="layui-input-inline" style="width:170px;">
                            <input type="text" name="keyword" placeholder="学号 / 姓名" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">课程</label>
                        <div class="layui-input-inline" style="width:180px;">
                            <select name="course_id">
                                <option value="">全部课程</option>
                                {volist name="courses" id="vo"}
                                <option value="{$vo.id}">{$vo.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">学期</label>
                        <div class="layui-input-inline" style="width:150px;">
                            <input type="text" name="semester" placeholder="如：2024-2025-1" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn">查询</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="table-box">
        <div class="tool-bar">
            <button class="layui-btn layui-btn-sm" id="btnBatch"><i class="layui-icon layui-icon-edit"></i> 批量录入</button>
            <button class="layui-btn layui-btn-sm layui-btn-normal" id="btnStat"><i class="layui-icon layui-icon-chart"></i> 成绩统计</button>
        </div>
        <table class="layui-table" lay-size="sm" style="margin-top:6px;">
            <thead>
            <tr>
                <th style="width:70px;">ID</th>
                <th style="width:110px;">学号</th>
                <th style="width:100px;">姓名</th>
                <th style="width:130px;">班级</th>
                <th>课程名称</th>
                <th style="width:70px;">学分</th>
                <th style="width:130px;">学期</th>
                <th style="width:110px;">成绩</th>
                <th style="width:90px;">等级</th>
                <th style="width:90px;">操作</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="dataPage" class="page-foot"></div>
    </div>
</div>

<!-- 批量录入弹层 -->
<script type="text/html" id="batchLayer">

    <form class="layui-form" id="batchForm" lay-filter="batchForm">
        <div class="layui-form-item">
            <label class="layui-form-label">选择课程</label>
            <div class="layui-input-block">
                <select name="course_id" id="batchCourse" lay-filter="batchCourse" lay-search>
                    <option value="">请选择课程</option>
                    {volist name="courses" id="vo"}
                    <option value="{$vo.id}">{$vo.name}</option>
                    {/volist}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">录入成绩</label>
            <div class="layui-input-block">
                <textarea class="layui-textarea" id="batchScore" style="height:220px;font-family:Consolas,monospace;"
                          placeholder="每行一条，格式：学号 成绩&#10;例如：&#10;2400012811 85&#10;2400012812 92"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="submitBatch">批量保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelBatch">取消</button>
            </div>
        </div>
    </form>
</script>

<!-- 统计弹层 -->
<script type="text/html" id="statLayer">

    <div id="statContent"></div>
</script>

<script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer', 'laypage'], function () {
    var form = layui.form, layer = layui.layer, laypage = layui.laypage, $ = layui.$;
    var page = 1, limit = 15, rows = [];

    function render(list, count) {
        rows = list;
        var html = '';
        if (!list.length) {
            html = '<tr><td colspan="10" class="empty-tip"><i class="layui-icon layui-icon-face-surprised"></i><br>暂无成绩数据</td></tr>';
        }
        list.forEach(function (r) {
            html += '<tr>' +
                '<td>' + r.id + '</td>' +
                '<td>' + r.student_no + '</td>' +
                '<td>' + r.student_name + '</td>' +
                '<td>' + r.class_name + '</td>' +
                '<td>' + r.course_name + '</td>' +
                '<td>' + r.credit + '</td>' +
                '<td>' + r.semester + '</td>' +
                '<td>' + (r.score === null ? '<span style="color:#c2c8d0;">未录入</span>' : r.score) + '</td>' +
                '<td>' + r.level + '</td>' +
                '<td>' +
                '<a class="layui-btn layui-btn-xs layui-btn-warm" data-act="edit" data-id="' + r.id + '">录入</a>' +
                '</td></tr>';
        });
        $('#tableBody').html(html);

        laypage.render({
            elem: 'dataPage', count: count, limit: limit, curr: page,
            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
            jump: function (obj, first) {
                if (!first) { page = obj.curr; limit = obj.limit; loadData(); }
            }
        });
    }

    function loadData() {
        $.get('/score/list', $('#searchForm').serialize() + '&page=' + page + '&limit=' + limit, function (res) {
            if (res.code !== 0) { layer.msg('数据加载失败', {icon: 2}); return; }
            render(res.data, res.count);
        }, 'json');
    }

    form.on('submit(searchBtn)', function () { page = 1; loadData(); return false; });
    $('#resetBtn').on('click', function () {
        $('#searchForm')[0].reset(); form.render(null, 'searchForm'); page = 1; loadData();
    });

    // 单条录入
    $('#tableBody').on('click', 'a[data-act]', function () {
        if ($(this).data('act') !== 'edit') { return; }
        var id = $(this).data('id');
        var row = rows.filter(function (d) { return d.id == id; })[0];
        if (!row) { return; }

        layer.prompt({
            title: '录入《' + row.course_name + '》成绩 - ' + row.student_name,
            formType: 3,
            value: row.score === null ? '' : row.score
        }, function (value, idx) {
            $.post('/score/save', {id: id, score: value}, function (res) {
                layer.close(idx);
                layer.msg(res.code === 1 ? res.msg : res.msg, {icon: res.code === 1 ? 1 : 2});
                if (res.code === 1) { loadData(); }
            }, 'json');
        });
    });

    // 批量录入
    $('#btnBatch').on('click', function () {
        layer.open({
            type: 1, title: '批量录入成绩', content: $('#batchLayer').html(), area: ['640px', '480px'],
            success: function () { form.render(null, 'batchForm'); }
        });
    });

    form.on('submit(submitBatch)', function (data) {
        var courseId = data.field.course_id;
        if (!courseId) { layer.msg('请先选择课程', {icon: 0}); return false; }

        var lines = $('#batchScore').val().split('\n');
        var scores = {}, count = 0, bad = [];
        lines.forEach(function (line) {
            line = line.trim();
            if (!line) { return; }
            var parts = line.split(/[\s,，]+/);
            if (parts.length < 2) { bad.push(line); return; }
            var no = parts[0], sc = parts[1];
            if (isNaN(parseFloat(sc))) { bad.push(line); return; }
            scores[no] = sc;
            count++;
        });

        if (!count) { layer.msg('没有解析到有效的成绩数据', {icon: 0}); return false; }

        layer.confirm('解析到 ' + count + ' 条成绩' + (bad.length ? '，' + bad.length + ' 行格式有误将被跳过' : '') + '，确认提交？', function (index) {
            layer.close(index);
            var idx = layer.load(2);
            $.post('/score/batch', {course_id: courseId, scores: scores}, function (res) {
                layer.close(idx);
                if (res.code === 1) {
                    layer.msg(res.msg, {icon: 1});
                    setTimeout(function () { layer.closeAll(); loadData(); }, 600);
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }, 'json');
        });
        return false;
    });

    $(document).on('click', '#cancelBatch', function () { layer.closeAll(); });

    // 成绩统计
    $('#btnStat').on('click', function () {
        var semester = $('#searchForm [name=semester]').val();
        $.get('/score/statistics', {semester: semester}, function (res) {
            if (res.code !== 1) { layer.msg('统计数据加载失败', {icon: 2}); return; }
            var html = '<table class="layui-table" lay-size="sm"><thead><tr>';
            html += '<th>课程名称</th><th style="width:70px;">学分</th><th style="width:80px;">人数</th>';
            html += '<th style="width:90px;">平均分</th><th style="width:80px;">最高</th><th style="width:80px;">最低</th>';
            html += '<th style="width:90px;">及格率</th></tr></thead><tbody>';
            if (!res.data.length) {
                html += '<tr><td colspan="7" class="empty-tip">暂无成绩统计数据</td></tr>';
            }
            res.data.forEach(function (s) {
                html += '<tr><td>' + s.course_name + '</td><td>' + s.credit + '</td><td>' + s.total + '</td>';
                html += '<td>' + s.avg_score + '</td><td>' + s.max_score + '</td><td>' + s.min_score + '</td>';
                html += '<td>' + s.pass_rate + '%</td></tr>';
            });
            html += '</tbody></table>';
            layer.open({
                type: 1, title: '成绩统计' + (semester ? '（' + semester + '）' : ''),
                content: html, area: ['760px', '520px']
            });
        }, 'json');
    });

    loadData();
});
</script>
</body>
</html>
