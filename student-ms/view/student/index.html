<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>学生管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">学生列表</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><span>学生管理</span><span class="sep">/</span><em>学生列表</em></span>
    </div>

    <!-- 搜索栏 -->
    <div class="search-box">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-row">
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">关键字</label>
                        <div class="layui-input-inline" style="width:180px;">
                            <input type="text" name="keyword" placeholder="学号 / 姓名 / 电话" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">所属班级</label>
                        <div class="layui-input-inline" style="width:150px;">
                            <select name="class_id" id="classSelect">
                                <option value="">全部班级</option>
                                {volist name="classes" id="vo"}
                                <option value="{$vo.id}">{$vo.name}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">性别</label>
                        <div class="layui-input-inline" style="width:110px;">
                            <select name="gender">
                                <option value="">全部</option>
                                <option value="1">男</option>
                                <option value="2">女</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">学籍状态</label>
                        <div class="layui-input-inline" style="width:110px;">
                            <select name="status">
                                <option value="">全部</option>
                                <option value="1">在读</option>
                                <option value="0">休学</option>
                                <option value="2">毕业</option>
                                <option value="3">退学</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item" style="text-align:right;">
                        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn">查询</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- 数据表格 -->
    <div class="table-box">
        <div class="tool-bar">
            <button class="layui-btn layui-btn-sm" id="btnAdd">
                <i class="layui-icon layui-icon-add-1"></i> 新增学生
            </button>
            <button class="layui-btn layui-btn-danger layui-btn-sm" id="btnBatchDelete">
                <i class="layui-icon layui-icon-delete"></i> 批量删除
            </button>
            <button class="layui-btn layui-btn-primary layui-btn-sm tool-bar-right" id="btnExport">
                <i class="layui-icon layui-icon-export"></i> 导出名单
            </button>
        </div>

        <table id="studentTable" lay-filter="studentTable" class="layui-table" lay-size="sm" style="margin-top:6px;">
            <thead>
            <tr>
                <th lay-type="checkbox" lay-skin="primary" style="width:40px;"></th>
                <th field="student_no">学号</th>
                <th field="name">姓名</th>
                <th field="gender_text">性别</th>
                <th field="class_name">班级</th>
                <th field="phone">联系电话</th>
                <th field="status_text">学籍状态</th>
                <th style="width:150px;">操作</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div id="studentPage" class="page-foot"></div>
    </div>
</div>

<!-- 新增/编辑弹层 -->
<script type="text/html" id="editLayer">

    <form class="layui-form" id="editForm" lay-filter="editForm">
        <input type="hidden" name="id" id="fieldId">
        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">学号</label>
                    <div class="layui-input-block">
                        <input type="text" name="student_no" class="layui-input" lay-verify="required" lay-required placeholder="如 2400012811">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">姓名</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" class="layui-input" lay-verify="required" lay-required placeholder="请输入姓名">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">性别</label>
                    <div class="layui-input-block">
                        <select name="gender">
                            <option value="0">未知</option>
                            <option value="1">男</option>
                            <option value="2">女</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">出生日期</label>
                    <div class="layui-input-block">
                        <input type="text" name="birthday" class="layui-input" placeholder="yyyy-MM-dd">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">所属班级</label>
                    <div class="layui-input-block">
                        <select name="class_id" lay-verify="required" lay-required>
                            <option value="">请选择班级</option>
                            {volist name="classes" id="vo"}
                            <option value="{$vo.id}">{$vo.name}</option>
                            {/volist}
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">入学日期</label>
                    <div class="layui-input-block">
                        <input type="text" name="enroll_date" class="layui-input" placeholder="yyyy-MM-dd">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">联系电话</label>
                    <div class="layui-input-block">
                        <input type="text" name="phone" class="layui-input" placeholder="请输入联系电话">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">电子邮箱</label>
                    <div class="layui-input-block">
                        <input type="text" name="email" class="layui-input" placeholder="请输入邮箱">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">学籍状态</label>
                    <div class="layui-input-block">
                        <select name="status">
                            <option value="1">在读</option>
                            <option value="0">休学</option>
                            <option value="2">毕业</option>
                            <option value="3">退学</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">家庭住址</label>
                    <div class="layui-input-block">
                        <input type="text" name="address" class="layui-input" placeholder="请输入家庭住址">
                    </div>
                </div>
            </div>
            <div class="layui-col-md12">
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea name="remark" class="layui-textarea" style="height:70px;" placeholder="选填"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item" style="margin-top:8px;">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="submitEdit">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelEdit">取消</button>
            </div>
        </div>
    </form>
</script>

<!-- 学生详情弹层 -->
<script type="text/html" id="detailLayer">

    <div id="detailContent"></div>
</script>

<script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer', 'laypage'], function () {
    var form = layui.form, layer = layui.layer, laypage = layui.laypage, $ = layui.$;
    var page = 1, limit = 15, currentData = [];

    // 渲染表格
    function renderTable(list, count) {
        currentData = list;
        var html = '';
        if (!list.length) {
            html = '<tr><td colspan="8" class="empty-tip"><i class="layui-icon layui-icon-face-surprised"></i><br>暂无符合条件的学生数据</td></tr>';
        }
        list.forEach(function (item, index) {
            html += '<tr>' +
                '<td><input type="checkbox" class="layui-form-checkbox" lay-skin="primary" lay-filter="checkRow" value="' + item.id + '"></td>' +
                '<td>' + item.student_no + '</td>' +
                '<td>' + item.name + '</td>' +
                '<td>' + item.gender_text + '</td>' +
                '<td>' + item.class_name + '</td>' +
                '<td>' + (item.phone || '-') + '</td>' +
                '<td>' + item.status_text + '</td>' +
                '<td>' +
                '<a class="layui-btn layui-btn-xs layui-btn-normal" data-act="detail" data-id="' + item.id + '">详情</a>' +
                '<a class="layui-btn layui-btn-xs layui-btn-warm" data-act="edit" data-id="' + item.id + '">编辑</a>' +
                '<a class="layui-btn layui-btn-xs layui-btn-danger" data-act="delete" data-id="' + item.id + '">删除</a>' +
                '</td>' +
                '</tr>';
        });
        $('#tableBody').html(html);
        form.render('checkbox');

        laypage.render({
            elem: 'studentPage',
            count: count,
            limit: limit,
            curr: page,
            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
            jump: function (obj, first) {
                if (!first) {
                    page = obj.curr;
                    limit = obj.limit;
                    loadData();
                }
            }
        });
    }

    // 加载数据
    function loadData() {
        var data = $('#searchForm').serialize();
        $.get('/student/list', data + '&page=' + page + '&limit=' + limit, function (res) {
            if (res.code !== 0) {
                layer.msg('数据加载失败', {icon: 2});
                return;
            }
            renderTable(res.data, res.count);
        }, 'json');
    }

    // 查询
    form.on('submit(searchBtn)', function () {
        page = 1;
        loadData();
        return false;
    });

    $('#resetBtn').on('click', function () {
        $('#searchForm')[0].reset();
        form.render(null, 'searchForm');
        page = 1;
        loadData();
    });

    // 新增
    $('#btnAdd').on('click', function () {
        layer.open({
            type: 1,
            title: '新增学生',
            content: $('#editLayer').html(),
            area: ['760px', '560px'],
            success: function () {
                form.render(null, 'editForm');
            }
        });
    });

    // 编辑 / 删除 / 详情
    $('#tableBody').on('click', 'a[data-act]', function () {
        var act = $(this).data('act');
        var id = $(this).data('id');

        if (act === 'edit') {
            var row = currentData.filter(function (d) { return d.id == id; })[0];
            if (!row) { return; }
            layer.open({
                type: 1,
                title: '编辑学生',
                content: $('#editLayer').html(),
                area: ['760px', '560px'],
                success: function () {
                    form.render(null, 'editForm');
                    $('#fieldId').val(row.id);
                    $('#editForm [name=student_no]').val(row.student_no);
                    $('#editForm [name=name]').val(row.name);
                    $('#editForm [name=gender]').val(row.gender);
                    $('#editForm [name=birthday]').val(row.birthday ? String(row.birthday).substring(0, 10) : '');
                    $('#editForm [name=phone]').val(row.phone);
                    $('#editForm [name=email]').val(row.email);
                    $('#editForm [name=address]').val(row.address);
                    $('#editForm [name=class_id]').val(row.class_id);
                    $('#editForm [name=enroll_date]').val(row.enroll_date ? String(row.enroll_date).substring(0, 10) : '');
                    $('#editForm [name=status]').val(row.status);
                    $('#editForm [name=remark]').val(row.remark);
                    form.render(null, 'editForm');
                }
            });
        } else if (act === 'delete') {
            layer.confirm('确定删除该学生吗？删除后可在数据库中恢复。', function (index) {
                layer.close(index);
                $.post('/student/delete', {ids: [id]}, function (res) {
                    if (res.code === 1) {
                        layer.msg('删除成功', {icon: 1});
                        loadData();
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        } else if (act === 'detail') {
            $.get('/student/detail', {id: id}, function (res) {
                if (res.code !== 1) {
                    layer.msg(res.msg, {icon: 2});
                    return;
                }
                var d = res.data;
                var html = '<div class="desc-list" style="padding:0;">';
                html += '<table class="layui-table desc-table" lay-size="sm"><tbody>';
                html += '<tr><th style="width:100px;">学号</th><td>' + d.student_no + '</td>';
                html += '<th style="width:100px;">姓名</th><td>' + d.name + '</td></tr>';
                html += '<tr><th>性别</th><td>' + d.gender_text + '</td>';
                html += '<th>出生日期</th><td>' + (d.birthday || '-') + '</td></tr>';
                html += '<tr><th>班级</th><td>' + d.class_name + '</td>';
                html += '<th>入学日期</th><td>' + (d.enroll_date || '-') + '</td></tr>';
                html += '<tr><th>联系电话</th><td>' + (d.phone || '-') + '</td>';
                html += '<th>邮箱</th><td>' + (d.email || '-') + '</td></tr>';
                html += '<tr><th>学籍状态</th><td>' + d.status_text + '</td>';
                html += '<th>家庭住址</th><td>' + (d.address || '-') + '</td></tr>';
                html += '</tbody></table></div>';

                html += '<div style="font-size:13px;color:#495468;font-weight:600;margin:16px 0 8px;">选课与成绩</div>';
                html += '<table class="layui-table" lay-size="sm"><thead><tr>';
                html += '<th>课程名称</th><th>学分</th><th>授课教师</th><th>学期</th><th>成绩</th><th>等级</th>';
                html += '</tr></thead><tbody>';
                if (!d.courses.length) {
                    html += '<tr><td colspan="6" class="empty-tip">该学生暂无选课记录</td></tr>';
                }
                d.courses.forEach(function (c) {
                    var lv = c.score === null ? '未录入' : (c.score >= 90 ? '优秀' : (c.score >= 80 ? '良好' : (c.score >= 70 ? '中等' : (c.score >= 60 ? '及格' : '不及格'))));
                    html += '<tr><td>' + c.course_name + '</td><td>' + c.credit + '</td><td>' + (c.teacher_name || '-') + '</td>';
                    html += '<td>' + c.semester + '</td><td>' + (c.score === null ? '-' : c.score) + '</td><td>' + lv + '</td></tr>';
                });
                html += '</tbody></table>';

                layer.open({
                    type: 1,
                    title: '学生详情 - ' + d.name,
                    content: html,
                    area: ['760px', '560px']
                });
            }, 'json');
        }
    });

    // 批量删除
    $('#btnBatchDelete').on('click', function () {
        var ids = [];
        $('#tableBody').find('input[lay-filter=checkRow]:checked').each(function () {
            ids.push($(this).val());
        });
        if (!ids.length) {
            layer.msg('请先勾选要删除的学生', {icon: 0});
            return;
        }
        layer.confirm('确定删除选中的 ' + ids.length + ' 名学生吗？', function (index) {
            layer.close(index);
            $.post('/student/delete', {ids: ids}, function (res) {
                if (res.code === 1) {
                    layer.msg('删除成功', {icon: 1});
                    loadData();
                } else {
                    layer.msg(res.msg, {icon: 2});
                }
            }, 'json');
        });
    });

    // 导出
    $('#btnExport').on('click', function () {
        window.location.href = '/student/export?' + $('#searchForm').serialize();
    });

    // 表单提交
    form.on('submit(submitEdit)', function (data) {
        var index = layer.load(2);
        $.post('/student/save', data.field, function (res) {
            layer.close(index);
            if (res.code === 1) {
                layer.msg(res.msg, {icon: 1});
                setTimeout(function () { layer.closeAll(); loadData(); }, 600);
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        }, 'json');
        return false;
    });

    $(document).on('click', '#cancelEdit', function () {
        layer.closeAll();
    });

    loadData();
});
</script>
</body>
</html>
