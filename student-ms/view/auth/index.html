<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>权限管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">权限管理</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><span>系统管理</span><span class="sep">/</span><em>权限管理</em></span>
    </div>

    <div class="search-box">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-row">
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <label class="layui-form-label">权限名称</label>
                        <div class="layui-input-inline" style="width:200px;">
                            <input type="text" name="keyword" placeholder="请输入权限名称" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="layui-form-item">
                        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn">查询</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="table-box">
        <div class="tool-bar">
            <button class="layui-btn layui-btn-sm" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i> 新增权限</button>
            <span class="layui-btn layui-btn-primary layui-btn-sm" id="btnExpand">展开全部</span>
        </div>
        <table class="layui-table" lay-size="sm" lay-filter="authTable" style="margin-top:6px;">
            <thead>
            <tr>
                <th style="width:70px;">ID</th>
                <th>权限名称</th>
                <th style="width:90px;">类型</th>
                <th style="width:170px;">路由地址</th>
                <th style="width:150px;">图标</th>
                <th style="width:70px;">排序</th>
                <th style="width:80px;">状态</th>
                <th style="width:150px;">操作</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- 新增/编辑权限 -->
<script type="text/html" id="editLayer">

    <form class="layui-form" id="editForm" lay-filter="editForm">
        <input type="hidden" name="id" id="fieldId">
        <div class="layui-row">
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">上级权限</label>
                    <div class="layui-input-block">
                        <select name="pid" id="pidSelect">
                            <option value="0">顶级权限</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">权限类型</label>
                    <div class="layui-input-block">
                        <select name="type">
                            <option value="1">菜单</option>
                            <option value="2">操作</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">权限名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="name" class="layui-input" lay-verify="required" lay-required placeholder="如：新增学生">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort" class="layui-input" value="0" min="0">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">路由地址</label>
                    <div class="layui-input-block">
                        <input type="text" name="path" class="layui-input" placeholder="菜单必填，如：student/list">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">图标</label>
                    <div class="layui-input-block">
                        <input type="text" name="icon" class="layui-input" placeholder="如：layui-icon-list">
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <select name="status">
                            <option value="1">启用</option>
                            <option value="0">停用</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="submitEdit">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelEdit">取消</button>
            </div>
        </div>
    </form>
</script><script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer', 'tree'], function () {
    var form = layui.form, layer = layui.layer, tree = layui.tree, $ = layui.$;
    var allNodes = [], expanded = true;

    // 拉平权限树，便于上下级下拉
    function flatten(nodes, depth, out) {
        nodes.forEach(function (n) {
            n.depth = depth;
            out.push(n);
            if (n.children) { flatten(n.children, depth + 1, out); }
        });
        return out;
    }

    function buildTreeHtml(nodes, level) {
        var html = '';
        nodes.forEach(function (n) {
            var hasChild = n.children && n.children.length;
            var indent = '&nbsp;'.repeat(level * 4);
            html += '<tr>' +
                '<td>' + n.id + '</td>' +
                '<td>' + indent + (level > 0 ? '<span style="color:#c2c8d0">└ </span>' : '') + n.name + '</td>' +
                '<td>' + n.type_text + '</td>' +
                '<td>' + (n.path || '-') + '</td>' +
                '<td>' + (n.icon || '-') + '</td>' +
                '<td>' + n.sort + '</td>' +
                '<td><span class="status-dot ' + (n.status == 1 ? 'status-on' : 'status-off') + '"></span>' + (n.status == 1 ? '启用' : '停用') + '</td>' +
                '<td>' +
                '<a class="layui-btn layui-btn-xs layui-btn-warm" data-act="edit" data-id="' + n.id + '">编辑</a>' +
                '<a class="layui-btn layui-btn-xs layui-btn-danger" data-act="delete" data-id="' + n.id + '">删除</a>' +
                '</td></tr>';
            if (hasChild) { html += buildTreeHtml(n.children, level + 1); }
        });
        return html;
    }

    function loadData() {
        $.get('/auth/list', function (res) {
            if (res.code !== 0) { layer.msg('数据加载失败', {icon: 2}); return; }
            allNodes = flatten(res.data, 0, []);

            var html = buildTreeHtml(res.data, 0);
            if (!res.data.length) {
                html = '<tr><td colspan="8" class="empty-tip"><i class="layui-icon layui-icon-face-surprised"></i><br>暂无权限数据</td></tr>';
            }
            $('#tableBody').html(html);
            fillPidSelect();
        }, 'json');
    }

    // 上级权限下拉
    function fillPidSelect() {
        var html = '<option value="0">顶级权限</option>';
        allNodes.forEach(function (n) {
            html += '<option value="' + n.id + '">' + '&nbsp;'.repeat(n.depth * 3) + n.name + '</option>';
        });
        $('#pidSelect').html(html);
        form.render('select');
    }

    form.on('submit(searchBtn)', function () { loadData(); return false; });
    $('#resetBtn').on('click', function () {
        $('#searchForm')[0].reset(); form.render(null, 'searchForm'); loadData();
    });

    $('#btnExpand').on('click', function () {
        expanded = !expanded;
        $('#btnExpand').text(expanded ? '收起全部' : '展开全部');
        loadData();
    });

    $('#btnAdd').on('click', function () {
        layer.open({
            type: 1, title: '新增权限', content: $('#editLayer').html(), area: ['680px', '500px'],
            success: function () { form.render(null, 'editForm'); }
        });
    });

    $('#tableBody').on('click', 'a[data-act]', function () {
        var act = $(this).data('act'), id = $(this).data('id');
        var row = allNodes.filter(function (d) { return d.id == id; })[0];
        if (!row) { return; }

        if (act === 'edit') {
            layer.open({
                type: 1, title: '编辑权限', content: $('#editLayer').html(), area: ['680px', '500px'],
                success: function () {
                    form.render(null, 'editForm');
                    $('#fieldId').val(row.id);
                    $('#editForm [name=pid]').val(row.pid);
                    $('#editForm [name=type]').val(row.type);
                    $('#editForm [name=name]').val(row.name);
                    $('#editForm [name=sort]').val(row.sort);
                    $('#editForm [name=path]').val(row.path);
                    $('#editForm [name=icon]').val(row.icon);
                    $('#editForm [name=status]').val(row.status);
                    form.render(null, 'editForm');
                }
            });
        } else if (act === 'delete') {
            layer.confirm('确定删除权限「' + row.name + '」吗？', function (index) {
                layer.close(index);
                $.post('/auth/delete', {id: id}, function (res) {
                    layer.msg(res.code === 1 ? '删除成功' : res.msg, {icon: res.code === 1 ? 1 : 2});
                    if (res.code === 1) { loadData(); }
                }, 'json');
            });
        }
    });

    form.on('submit(submitEdit)', function (data) {
        var index = layer.load(2);
        $.post('/auth/save', data.field, function (res) {
            layer.close(index);
            if (res.code === 1) {
                layer.msg(res.msg, {icon: 1});
                setTimeout(function () { layer.closeAll(); loadData(); }, 500);
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        }, 'json');
        return false;
    });

    $(document).on('click', '#cancelEdit', function () { layer.closeAll(); });
    loadData();
});
</script>
</body>
</html>
