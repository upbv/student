<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>登录日志</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">登录日志</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><span>日志管理</span><span class="sep">/</span><em>登录日志</em></span>
    </div>

    <div class="search-box">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-row">
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">关键字</label>
                        <div class="layui-input-inline" style="width:170px;">
                            <input type="text" name="keyword" placeholder="账号 / IP" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">结果</label>
                        <div class="layui-input-inline" style="width:120px;">
                            <select name="status">
                                <option value="">全部</option>
                                <option value="1">成功</option>
                                <option value="0">失败</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">起始日期</label>
                        <div class="layui-input-inline" style="width:140px;">
                            <input type="text" name="start_date" placeholder="yyyy-MM-dd" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">截止日期</label>
                        <div class="layui-input-inline" style="width:140px;">
                            <input type="text" name="end_date" placeholder="yyyy-MM-dd" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn">查询</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="table-box">
        <div class="tool-bar">
            <button class="layui-btn layui-btn-danger layui-btn-sm" id="btnClear"><i class="layui-icon layui-icon-delete"></i> 清空日志</button>
        </div>
        <table class="layui-table" lay-size="sm" style="margin-top:6px;">
            <thead>
            <tr>
                <th style="width:70px;">ID</th>
                <th style="width:130px;">账号</th>
                <th style="width:150px;">登录时间</th>
                <th style="width:140px;">IP 地址</th>
                <th style="width:90px;">结果</th>
                <th>说明</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="dataPage" class="page-foot"></div>
    </div>
</div>

<script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer', 'laypage'], function () {
    var form = layui.form, layer = layui.layer, laypage = layui.laypage, $ = layui.$;
    var page = 1, limit = 15;

    function render(list, count) {
        var html = '';
        if (!list.length) {
            html = '<tr><td colspan="6" class="empty-tip"><i class="layui-icon layui-icon-face-surprised"></i><br>暂无登录日志</td></tr>';
        }
        list.forEach(function (r) {
            html += '<tr>' +
                '<td>' + r.id + '</td>' +
                '<td>' + (r.username || '-') + '</td>' +
                '<td>' + r.login_time + '</td>' +
                '<td>' + r.ip + '</td>' +
                '<td><span class="status-dot ' + (r.status == 1 ? 'status-on' : 'status-off') + '"></span>' + r.status_text + '</td>' +
                '<td>' + (r.msg || '-') + '</td>' +
                '</tr>';
        });
        $('#tableBody').html(html);

        laypage.render({
            elem: 'dataPage', count: count, limit: limit, curr: page,
            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
            jump: function (obj, first) {
                if (!first) { page = obj.curr; limit = obj.limit; loadData(); }
            }
        });
    }

    function loadData() {
        $.get('/loginlog/list', $('#searchForm').serialize() + '&page=' + page + '&limit=' + limit, function (res) {
            if (res.code !== 0) { layer.msg('数据加载失败', {icon: 2}); return; }
            render(res.data, res.count);
        }, 'json');
    }

    form.on('submit(searchBtn)', function () { page = 1; loadData(); return false; });
    $('#resetBtn').on('click', function () {
        $('#searchForm')[0].reset(); form.render(null, 'searchForm'); page = 1; loadData();
    });

    $('#btnClear').on('click', function () {
        layer.confirm('确定清空全部登录日志吗？该操作不可恢复。', function (index) {
            layer.close(index);
            $.post('/loginlog/clear', {}, function (res) {
                layer.msg(res.code === 1 ? res.msg : res.msg, {icon: res.code === 1 ? 1 : 2});
                if (res.code === 1) { page = 1; loadData(); }
            }, 'json');
        });
    });

    loadData();
});
</script>
</body>
</html>
