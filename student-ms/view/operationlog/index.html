<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>操作日志</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/admin.css">
</head>
<body>
<div class="page-box">

    <div class="page-head">
        <span class="title">操作日志</span>
        <span class="breadcrumb"><span>首页</span><span class="sep">/</span><span>日志管理</span><span class="sep">/</span><em>操作日志</em></span>
    </div>

    <div class="search-box">
        <form class="layui-form" lay-filter="searchForm" id="searchForm">
            <div class="layui-row">
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">关键字</label>
                        <div class="layui-input-inline" style="width:170px;">
                            <input type="text" name="keyword" placeholder="账号 / 动作 / IP" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">功能模块</label>
                        <div class="layui-input-inline" style="width:140px;">
                            <select name="module">
                                <option value="">全部模块</option>
                                <option value="账号管理">账号管理</option>
                                <option value="角色管理">角色管理</option>
                                <option value="权限管理">权限管理</option>
                                <option value="学生管理">学生管理</option>
                                <option value="班级管理">班级管理</option>
                                <option value="院系管理">院系管理</option>
                                <option value="教师管理">教师管理</option>
                                <option value="课程管理">课程管理</option>
                                <option value="选课管理">选课管理</option>
                                <option value="成绩管理">成绩管理</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">结果</label>
                        <div class="layui-input-inline" style="width:120px;">
                            <select name="status">
                                <option value="">全部</option>
                                <option value="1">成功</option>
                                <option value="0">失败</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">起始日期</label>
                        <div class="layui-input-inline" style="width:140px;">
                            <input type="text" name="start_date" placeholder="yyyy-MM-dd" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <label class="layui-form-label">截止日期</label>
                        <div class="layui-input-inline" style="width:140px;">
                            <input type="text" name="end_date" placeholder="yyyy-MM-dd" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md3">
                    <div class="layui-form-item">
                        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="searchBtn">查询</button>
                        <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="table-box">
        <div class="tool-bar">
            <button class="layui-btn layui-btn-danger layui-btn-sm" id="btnClear"><i class="layui-icon layui-icon-delete"></i> 清空日志</button>
        </div>
        <table class="layui-table" lay-size="sm" style="margin-top:6px;">
            <thead>
            <tr>
                <th style="width:70px;">ID</th>
                <th style="width:120px;">操作人</th>
                <th style="width:110px;">模块</th>
                <th style="width:120px;">动作</th>
                <th style="width:150px;">操作时间</th>
                <th style="width:130px;">IP 地址</th>
                <th>请求地址</th>
                <th style="width:90px;">结果</th>
                <th style="width:80px;">详情</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="dataPage" class="page-foot"></div>
    </div>
</div>

<script type="text/html" id="detailLayer">

    <div id="detailContent"></div>
</script><script src="/static/layui/jquery.min.js"></script>
<script src="/static/layui/layui.js"></script>
<script>
layui.use(['form', 'layer', 'laypage'], function () {
    var form = layui.form, layer = layui.layer, laypage = layui.laypage, $ = layui.$;
    var page = 1, limit = 15, rows = [];

    function render(list, count) {
        rows = list;
        var html = '';
        if (!list.length) {
            html = '<tr><td colspan="9" class="empty-tip"><i class="layui-icon layui-icon-face-surprised"></i><br>暂无操作日志</td></tr>';
        }
        list.forEach(function (r) {
            html += '<tr>' +
                '<td>' + r.id + '</td>' +
                '<td>' + (r.username || '-') + '</td>' +
                '<td>' + (r.module || '-') + '</td>' +
                '<td>' + (r.action || '-') + '</td>' +
                '<td>' + r.operate_time + '</td>' +
                '<td>' + r.ip + '</td>' +
                '<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + r.method + ' ' + r.url + '">' + r.method + ' ' + r.url + '</td>' +
                '<td><span class="status-dot ' + (r.status == 1 ? 'status-on' : 'status-off') + '"></span>' + r.status_text + '</td>' +
                '<td><a class="layui-btn layui-btn-xs layui-btn-normal" data-act="detail" data-id="' + r.id + '">查看</a></td>' +
                '</tr>';
        });
        $('#tableBody').html(html);

        laypage.render({
            elem: '#dataPage', count: count, limit: limit, curr: page,
            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
            jump: function (obj, first) {
                if (!first) { page = obj.curr; limit = obj.limit; loadData(); }
            }
        });
    }

    function loadData() {
        $.get('/operationlog/list', $('#searchForm').serialize() + '&page=' + page + '&limit=' + limit, function (res) {
            if (res.code !== 0) { layer.msg('数据加载失败', {icon: 2}); return; }
            render(res.data, res.count);
        }, 'json');
    }

    form.on('submit(searchBtn)', function () { page = 1; loadData(); return false; });
    $('#resetBtn').on('click', function () {
        $('#searchForm')[0].reset(); form.render(null, 'searchForm'); page = 1; loadData();
    });

    $('#tableBody').on('click', 'a[data-act]', function () {
        if ($(this).data('act') !== 'detail') { return; }
        var id = $(this).data('id');
        var row = rows.filter(function (d) { return d.id == id; })[0];
        if (!row) { return; }

        var html = '<table class="layui-table" lay-size="sm"><tbody>';
        html += '<tr><th style="width:100px;">操作人</th><td>' + (row.username || '-') + '</td><th style="width:100px;">模块</th><td>' + (row.module || '-') + '</td></tr>';
        html += '<tr><th>动作</th><td>' + (row.action || '-') + '</td><th>结果</th><td>' + row.status_text + '</td></tr>';
        html += '<tr><th>请求</th><td colspan="3">' + row.method + ' ' + row.url + '</td></tr>';
        html += '<tr><th>IP 地址</th><td>' + row.ip + '</td><th>时间</th><td>' + row.operate_time + '</td></tr>';
        html += '<tr><th>请求参数</th><td colspan="3" style="word-break:break-all;">' + (row.params || '-') + '</td></tr>';
        html += '<tr><th>结果摘要</th><td colspan="3" style="word-break:break-all;">' + (row.result || '-') + '</td></tr>';
        if (row.error_msg) {
            html += '<tr><th>错误信息</th><td colspan="3" style="color:#f13b3b;word-break:break-all;">' + row.error_msg + '</td></tr>';
        }
        html += '</tbody></table>';

        layer.open({type: 1, title: '操作详情 - ' + (row.action || ''), content: html, area: ['760px', '460px']});
    });

    $('#btnClear').on('click', function () {
        layer.confirm('确定清空全部操作日志吗？该操作不可恢复。', function (index) {
            layer.close(index);
            $.post('/operationlog/clear', {}, function (res) {
                layer.msg(res.code === 1 ? res.msg : res.msg, {icon: res.code === 1 ? 1 : 2});
                if (res.code === 1) { page = 1; loadData(); }
            }, 'json');
        });
    });

    loadData();
});
</script>
</body>
</html>
