<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>无权访问</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F7F6F2;
            font-family: "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .err-box {
            width: 440px;
            background: #fff;
            border: 1px solid #E3E0D9;
            border-radius: 2px;
            padding: 40px 34px;
            text-align: center;
        }
        .err-box .icon {
            font-size: 34px;
            color: #2F5D50;
        }
        .err-box h2 {
            font-family: Georgia, "Songti SC", "SimSun", serif;
            font-size: 20px;
            color: #1A1A1A;
            margin: 16px 0 8px;
            font-weight: 700;
        }
        .err-box p {
            font-size: 12.5px;
            color: #75726B;
            margin: 0 0 26px;
        }
    </style>
</head>
<body>
<div class="err-box">
    <i class="layui-icon layui-icon-auz icon"></i>
    <h2>没有访问权限</h2>
    <p>{$msg}</p>
    <a href="/dashboard" target="_top" class="layui-btn layui-btn-sm layui-btn-normal">返回控制台</a>
</div>
</body>
</html>
